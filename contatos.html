<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos - Barbearia Space For Men</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="contato.css">
</head>

<body>

    <header>
        <div class="caixa">
            <h1><img src="./img/logo.png" alt="logo"></h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a> </li>
                    <li><a href="produtos.html">Produtos</a> </li>
                    <li><a href="contatos.html">Contatos</a> </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <form action="">
            <label for="nomesobrenome">Nome e Sobrenome</label>
            <input type="text" id="nomesobrenome" class="inputs-padrao" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" class="inputs-padrao" required placeholder="seuemail@dominio.com">

            <label for="tel">Telefone</label>
            <input type="tel" id="tel" class="inputs-padrao" required placeholder="(xx)xxxxx-xxxx">

            <label for="Mensagem">Mensagem</label>
            <textarea name="" id="Mensagem" cols="67.2" rows="10"></textarea>

            <fieldset>
                <legend>Como prefere o nosso contato</legend>
                <label for="radio-email"><input type="radio" name="contato" id="radio-email">e-mail</label>


                <label for="radio-telefone"><input type="radio" name="contato" id="radio-telefone">telefone</label>


                <label for="radio-whatsapp"><input type="radio" name="contato" id="radio-whatsapp">whatsapp</label>

            </fieldset>

            <fieldset>

                <legend>Qual horario prefere ser atendido?</legend>
                <select name="" id="">

                    <option value="">Manhã</option>
                    <option value="">Tarde</option>
                    <option value="">Noite</option>


                </select>
            </fieldset>
            <label for="checkbox" class="checkbox"><input type="checkbox" name="" id="checkbox">Gostaria de receber
                nossas novidade por e-mail?</label>



            <input type="submit" value="Enviar" class="enviar">


        </form>

        <table>

            <thead>
                <tr>
                    <th>Dia</th>
                    <th>horario</th>
                </tr>

            </thead>

            <tbody>
                <tr>
                    <td>Segunda-Feira</td>
                    <td>8h ~ 20h</td>
                </tr>
                <tr>
                    <td>Quarta-Feira</td>
                    <td>8h ~ 20h</td>
                </tr>
                <tr>
                    <td>Sexta-Feira</td>
                    <td>8h ~ 20h</td>
                </tr>

            </tbody>
        </table>


    </main>


    <footer>
        <img src="./img/logo-branco.png" alt="logo-branco">
        <p class="copy">&copy;Copyright Barbearia Space for Men</p>
    </footer>

</body>

</html>
